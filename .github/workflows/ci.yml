name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # No install step: the tool has zero third-party dependencies.
      - name: Test suite (zero network, zero packages)
        run: python3 -m unittest discover -s tests -t . -v

      # The smoke fixture must carry every column rules.example.json refers to,
      # or the validator correctly exits 2 and this gate fails on first push.
      - name: Smoke run against the example rules
        run: |
          cat > /tmp/sample.csv <<'EOF'
          surname,first_name,file_number,date_of_birth,email,phone,gender,age
          Okafor,Ada,1001,1990-05-01,ada-at-example-dot-com,08033333333,Female,34
          Okafor,Ada,1001,not-a-date,bad-email,123,Male,200
          EOF
          python3 records_audit.py /tmp/sample.csv --rules rules.example.json --audit-log /tmp/audit.jsonl || test $? -eq 1
          test "$(wc -l < /tmp/audit.jsonl)" -eq 1
